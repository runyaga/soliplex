id: "deep_coder_sandbox"
name: "Coder Sandbox"
description: "Write code and execute it in an isolated Docker container - results returned to chat"
suggestions:
  # Increasingly complex CS algorithm demos
  - "Implement binary search and demonstrate it finding elements in a sorted array"
  - "Build a stack and queue from scratch, then solve the balanced parentheses problem"
  - "Implement merge sort and visualize each merge step with the array state"
  - "Create a hash table with collision handling and demonstrate insert/lookup/delete"
  - "Build a binary search tree with insert, search, and in-order traversal"
  - "Implement Dijkstra's shortest path algorithm on a weighted graph"
  - "Build a trie for autocomplete and demonstrate prefix matching"
  - "Implement dynamic programming for the knapsack problem with memoization"
  - "Create a red-black tree with self-balancing insert operations"
  - "Implement A* pathfinding on a 2D grid with obstacles and visualize the path"

agent:
  kind: "deep"
  model_name: "qwen3-coder:30b"
  system_prompt: "./prompt.txt"

  # Full coding workflow with execution
  include_todo: true
  include_filesystem: true
  include_subagents: false
  include_skills: false
  include_execute: true

  # Docker sandbox for isolated execution
  # Requires: uv sync --group sandbox
  # Requires: DOCKER_HOST in .env (e.g., ssh://bizon)
  # Note: Files created in container are ephemeral (no local persistence with remote Docker)
  backend_kind: "docker"
  docker_config:
    image: "python:3.12-slim"
    work_dir: "/workspace"

  # Disable approval for code execution - results return directly to chat
  interrupt_on:
    execute: false



allow_mcp: false
