id: "deep_planner"
name: "Deep Planner"
description: "Project planning agent with structured plan documents"
suggestions:
  - "Help me plan a website redesign project"
  - "Break down learning Python into weekly goals"
  - "Create a roadmap for launching a startup"

agent:
  kind: "deep"
  model_name: "gpt-oss:latest"
  system_prompt: "./prompt.txt"

  # Tier 1: Todo + Filesystem - task decomposition with plan output
  include_todo: true
  include_filesystem: true
  include_subagents: false
  include_skills: false


allow_mcp: false
